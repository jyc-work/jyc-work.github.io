name: Build and deploy website

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-fund --no-audit
      - name: Enforce public engineering article quality gate
        run: python3 scripts/blog_quality.py
      - name: Validate English engineering article editions
        run: python3 scripts/check_en_publication.py
      - name: Typecheck and generate static site
        run: npm run build
      - name: Validate technology tracker
        run: python3 -m unittest discover -s scripts/tests -v
      - name: Install Chromium for mobile smoke tests
        run: npx playwright install --with-deps chromium
      - name: Mobile viewport and interaction checks
        run: npm run test:e2e
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
